<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Prediction Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"DM Sans"', 'system-ui', 'sans-serif'],
            display: ['"Outfit"', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    @keyframes floatCloud {
      0%, 100% { transform: translateX(0) translateY(0); opacity: 0.4; }
      50% { transform: translateX(30px) translateY(-15px); opacity: 0.7; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.85; }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .animated-bg {
      background: linear-gradient(
        -45deg,
        #0c1445,
        #1a3a6e,
        #2d5a87,
        #4a7c9e,
        #6b9bb8,
        #3d6b8a,
        #1e4d6b
      );
      background-size: 400% 400%;
      animation: gradientShift 18s ease infinite;
    }
    .cloud {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      filter: blur(40px);
      animation: floatCloud 12s ease-in-out infinite;
    }
    .cloud-1 { width: 280px; height: 120px; top: 10%; left: 5%; animation-delay: 0s; }
    .cloud-2 { width: 200px; height: 90px; top: 60%; right: 10%; animation-delay: -4s; }
    .cloud-3 { width: 320px; height: 140px; bottom: 15%; left: 20%; animation-delay: -8s; }
    .sun-glow {
      position: absolute;
      top: -80px;
      right: -80px;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 200, 100, 0.25) 0%, transparent 70%);
      animation: pulseGlow 6s ease-in-out infinite;
    }
    .glass {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
    }
    .glass-input {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    .glass-input:focus {
      outline: none;
      border-color: rgba(147, 197, 253, 0.6);
      box-shadow: 0 0 0 3px rgba(147, 197, 253, 0.15);
      background: rgba(255, 255, 255, 0.12);
    }
    .spinner {
      width: 1.25rem;
      height: 1.25rem;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .result-enter {
      animation: resultFade 0.5s ease forwards;
    }
    @keyframes resultFade {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="min-h-screen font-sans text-white antialiased">
  <div class="animated-bg fixed inset-0 -z-10 overflow-hidden">
    <div class="sun-glow"></div>
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
  </div>

  <main class="relative z-10 flex min-h-screen items-center justify-center px-4 py-10 sm:px-6 lg:px-8">
    <div class="w-full max-w-4xl">
      <!-- Header -->
      <header class="mb-8 text-center">
        <div class="mx-auto mb-4 inline-flex h-14 w-14 items-center justify-center rounded-2xl glass">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-sky-200" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15a4.5 4.5 0 004.5 4.5H18a3.75 3.75 0 001.332-7.257 3 3 0 00-3.758-3.848 5.25 5.25 0 00-10.233 2.33A4.502 4.502 0 002.25 15z" />
          </svg>
        </div>
        <h1 class="font-display text-3xl font-bold tracking-tight sm:text-4xl">Weather Prediction</h1>
        <p class="mt-2 text-sm text-sky-100/80 sm:text-base">Enter current conditions to forecast temperature</p>
      </header>

      <!-- Form Card -->
      <div class="glass rounded-3xl p-6 sm:p-8 lg:p-10">
        <form id="prediction-form" novalidate>
          <!-- Atmospheric conditions -->
          <fieldset class="mb-8">
            <legend class="mb-4 flex items-center gap-2 font-display text-sm font-semibold uppercase tracking-wider text-sky-200/90">
              <span class="h-px flex-1 bg-white/10"></span>
              Atmospheric Conditions
              <span class="h-px flex-1 bg-white/10"></span>
            </legend>
            <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
              <label class="block">
                <span class="mb-1.5 block text-xs font-medium text-sky-100/70">Wind Speed</span>
                <input type="number" name="wind_kph" step="any" required placeholder="e.g. 12.5"
                  class="glass-input w-full rounded-xl px-4 py-2.5 text-sm text-white placeholder-white/30" />
              </label>
              <label class="block">
                <span class="mb-1.5 block text-xs font-medium text-sky-100/70">Pressure (mb)</span>
                <input type="number" name="pressure_mb" step="any" required placeholder="e.g. 1013"
                  class="glass-input w-full rounded-xl px-4 py-2.5 text-sm text-white placeholder-white/30" />
              </label>
              <label class="block">
                <span class="mb-1.5 block text-xs font-medium text-sky-100/70">Precipitation (mm)</span>
                <input type="number" name="precip_mm" step="any" required placeholder="e.g. 0"
                  class="glass-input w-full rounded-xl px-4 py-2.5 text-sm text-white placeholder-white/30" />
              </label>
              <label class="block">
                <span class="mb-1.5 block text-xs font-medium text-sky-100/70">Humidity (%)</span>
                <input type="number" name="humidity" step="any" required placeholder="e.g. 65"
                  class="glass-input w-full rounded-xl px-4 py-2.5 text-sm text-white placeholder-white/30" />
              </label>
              <label class="block">
                <span class="mb-1.5 block text-xs font-medium text-sky-100/70">Visibility (km)</span>
                <input type="number" name="visibility_km" step="any" required placeholder="e.g. 10"
                  class="glass-input w-full rounded-xl px-4 py-2.5 text-sm text-white placeholder-white/30" />
              </label>
              <label class="block">
                <span class="mb-1.5 block text-xs font-medium text-sky-100/70">UV Index</span>
                <input type="number" name="uv_index" step="any" required placeholder="e.g. 5"
                  class="glass-input w-full rounded-xl px-4 py-2.5 text-sm text-white placeholder-white/30" />
              </label>
            </div>
          </fieldset>

          <!-- Air quality -->
          <fieldset class="mb-8">
            <legend class="mb-4 flex items-center gap-2 font-display text-sm font-semibold uppercase tracking-wider text-sky-200/90">
              <span class="h-px flex-1 bg-white/10"></span>
              Air Quality
              <span class="h-px flex-1 bg-white/10"></span>
            </legend>
            <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
              <label class="block">
                <span class="mb-1.5 block text-xs font-medium text-sky-100/70">PM2.5</span>
                <input type="number" name="air_quality_PM2.5" step="any" required placeholder="e.g. 15"
                  class="glass-input w-full rounded-xl px-4 py-2.5 text-sm text-white placeholder-white/30" />
              </label>
              <label class="block">
                <span class="mb-1.5 block text-xs font-medium text-sky-100/70">PM10</span>
                <input type="number" name="air_quality_PM10" step="any" required placeholder="e.g. 25"
                  class="glass-input w-full rounded-xl px-4 py-2.5 text-sm text-white placeholder-white/30" />
              </label>
            </div>
          </fieldset>

          <!-- Date & time -->
          <fieldset class="mb-8">
            <legend class="mb-4 flex items-center gap-2 font-display text-sm font-semibold uppercase tracking-wider text-sky-200/90">
              <span class="h-px flex-1 bg-white/10"></span>
              Date &amp; Time
              <span class="h-px flex-1 bg-white/10"></span>
            </legend>
            <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
              <label class="block">
                <span class="mb-1.5 block text-xs font-medium text-sky-100/70">Month (1–12)</span>
                <input type="number" name="month" min="1" max="12" step="1" required placeholder="1–12"
                  class="glass-input w-full rounded-xl px-4 py-2.5 text-sm text-white placeholder-white/30" />
              </label>
              <label class="block">
                <span class="mb-1.5 block text-xs font-medium text-sky-100/70">Day (1–31)</span>
                <input type="number" name="day" min="1" max="31" step="1" required placeholder="1–31"
                  class="glass-input w-full rounded-xl px-4 py-2.5 text-sm text-white placeholder-white/30" />
              </label>
              <label class="block">
                <span class="mb-1.5 block text-xs font-medium text-sky-100/70">Hour (0–23)</span>
                <input type="number" name="hour" min="0" max="23" step="1" required placeholder="0–23"
                  class="glass-input w-full rounded-xl px-4 py-2.5 text-sm text-white placeholder-white/30" />
              </label>
            </div>
          </fieldset>

          <button
            type="submit"
            id="submit-btn"
            class="flex w-full items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-sky-500 to-blue-600 px-6 py-3.5 font-display text-base font-semibold text-white shadow-lg shadow-sky-900/30 transition hover:from-sky-400 hover:to-blue-500 focus:outline-none focus:ring-2 focus:ring-sky-300/50 focus:ring-offset-2 focus:ring-offset-transparent disabled:cursor-not-allowed disabled:opacity-70 sm:w-auto sm:min-w-[200px]"
          >
            <span id="btn-text">Predict Temperature</span>
            <span id="btn-spinner" class="spinner hidden" aria-hidden="true"></span>
          </button>
        </form>

        <!-- Result -->
        <div id="result-container" class="mt-8 hidden">
          <div id="result-success" class="result-enter hidden rounded-2xl border border-emerald-400/30 bg-emerald-500/10 px-6 py-5 text-center">
            <p class="text-sm font-medium uppercase tracking-wider text-emerald-200/80">Forecast Ready</p>
            <p id="prediction-display" class="mt-2 font-display text-3xl font-bold text-white sm:text-4xl"></p>
          </div>
          <div id="result-error" class="result-enter hidden rounded-2xl border border-red-400/30 bg-red-500/10 px-6 py-4 text-center text-sm text-red-100"></div>
        </div>
      </div>

      <p class="mt-6 text-center text-xs text-sky-100/50">Powered by ensemble ML · XGBoost + Random Forest</p>
    </div>
  </main>

  <script>
    const API_URL = 'https://weather-prediction-web-app-8e4m.onrender.com/predict';

    const FIELD_KEYS = [
      'wind_kph',
      'pressure_mb',
      'precip_mm',
      'humidity',
      'visibility_km',
      'uv_index',
      'air_quality_PM2.5',
      'air_quality_PM10',
      'month',
      'day',
      'hour',
    ];

    const form = document.getElementById('prediction-form');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');
    const resultContainer = document.getElementById('result-container');
    const resultSuccess = document.getElementById('result-success');
    const resultError = document.getElementById('result-error');
    const predictionDisplay = document.getElementById('prediction-display');

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      btnText.textContent = isLoading ? 'Predicting...' : 'Predict Temperature';
      btnSpinner.classList.toggle('hidden', !isLoading);
    }

    function hideResults() {
      resultContainer.classList.add('hidden');
      resultSuccess.classList.add('hidden');
      resultError.classList.add('hidden');
    }

    function showSuccess(temperature) {
      resultContainer.classList.remove('hidden');
      resultError.classList.add('hidden');
      resultSuccess.classList.remove('hidden');
      resultSuccess.classList.remove('result-enter');
      void resultSuccess.offsetWidth;
      resultSuccess.classList.add('result-enter');
      predictionDisplay.textContent = `Predicted Temperature: ${temperature} °C`;
    }

    function showError(message) {
      resultContainer.classList.remove('hidden');
      resultSuccess.classList.add('hidden');
      resultError.classList.remove('hidden');
      resultError.classList.remove('result-enter');
      void resultError.offsetWidth;
      resultError.classList.add('result-enter');
      resultError.textContent = message;
    }

    function collectPayload(formEl) {
      const payload = {};
      for (const key of FIELD_KEYS) {
        const input = formEl.elements[key];
        const raw = input?.value?.trim();
        if (raw === '' || raw == null) {
          throw new Error(`Please enter a value for ${key.replace(/_/g, ' ')}.`);
        }
        const num = Number(raw);
        if (Number.isNaN(num)) {
          throw new Error(`"${key}" must be a valid number.`);
        }
        payload[key] = num;
      }
      if (payload.month < 1 || payload.month > 12) {
        throw new Error('Month must be between 1 and 12.');
      }
      if (payload.day < 1 || payload.day > 31) {
        throw new Error('Day must be between 1 and 31.');
      }
      if (payload.hour < 0 || payload.hour > 23) {
        throw new Error('Hour must be between 0 and 23.');
      }
      return payload;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideResults();

      let payload;
      try {
        payload = collectPayload(form);
      } catch (err) {
        showError(err.message);
        return;
      }

      setLoading(true);

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        let data;
        try {
          data = await response.json();
        } catch {
          throw new Error('Server returned an invalid response. Is the API running?');
        }

        if (!response.ok || data.error) {
          throw new Error(data.error || `Request failed (${response.status}).`);
        }

        if (data.prediction == null || Number.isNaN(Number(data.prediction))) {
          throw new Error('No valid prediction was returned from the server.');
        }

        showSuccess(Number(data.prediction));
      } catch (err) {
        const msg = err.message || 'Something went wrong.';
        if (msg.includes('Failed to fetch') || msg.includes('NetworkError')) {
          showError('Please wait, the server is waking up...');
        } else {
          showError(msg);
        }
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
